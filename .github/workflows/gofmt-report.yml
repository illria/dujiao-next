name: gofmt-report

on:
  pull_request:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Print gofmt diff
        shell: bash
        run: |
          set +e
          gofmt -d $(git ls-files '*.go') > /tmp/gofmt.diff 2> /tmp/gofmt.err
          status=$?
          echo "gofmt exit status: ${status}"
          echo '--- gofmt stderr ---'
          cat /tmp/gofmt.err
          echo '--- gofmt diff ---'
          sed -n '1,1600p' /tmp/gofmt.diff
          if [[ ${status} -ne 0 ]]; then
            exit "${status}"
          fi
          if [[ -s /tmp/gofmt.diff ]]; then
            exit 1
          fi
